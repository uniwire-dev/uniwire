name: Release

# Tags `v*` publish the `uniwire` library to PyPI and the MCP server image to ghcr.io; tags
# `data-iec81346-v*` publish the optional `uniwire-data-iec81346` data package.
# Building runs without any publishing credentials; only the publish jobs get an OIDC token (PyPI trusted
# publishing: configure a trusted publisher for each project with this workflow and the `pypi` environment).

on:
  push:
    tags:
      - "v*"
      - "data-iec81346-v*"

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" -e packages/uniwire-data-iec81346
      - name: Lint and tests
        run: |
          ruff check .
          python -m pytest -q

  build-uniwire:
    if: startsWith(github.ref_name, 'v')
    name: Build uniwire
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches the package version
        run: |
          version="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/uniwire/__init__.py').read()).group(1))")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-uniwire
          path: dist/
          if-no-files-found: error

  publish-uniwire:
    name: Publish uniwire to PyPI
    needs: build-uniwire
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uniwire
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-uniwire
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist/

  image-mcp:
    if: startsWith(github.ref_name, 'v')
    name: Build and push the MCP server image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/uniwire-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-data-iec81346:
    if: startsWith(github.ref_name, 'data-iec81346-v')
    name: Build uniwire-data-iec81346
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches the package version
        working-directory: packages/uniwire-data-iec81346
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "data-iec81346-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build packages/uniwire-data-iec81346 --out-dir dist
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-data-iec81346
          path: dist/
          if-no-files-found: error

  publish-data-iec81346:
    name: Publish uniwire-data-iec81346 to PyPI
    needs: build-data-iec81346
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uniwire-data-iec81346
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-data-iec81346
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist/
