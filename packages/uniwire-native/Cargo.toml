[package]
name = "uniwire-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Optional compiled search of the uniwire grid link router"
repository = "https://github.com/uniwire-dev/uniwire"
publish = false

[lib]
name = "uniwire_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
