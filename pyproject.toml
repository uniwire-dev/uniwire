[project]
name = "uniwire"
dynamic = ["version"]
description = "Electrical diagrams, as code: an open standard to describe electrical installations, with validation, rules, BOM, wire lists and single-line / multi-line SVG/PDF drawings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "uniwire contributors" }]
keywords = ["electrical", "single-line diagram", "one-line diagram", "multi-line diagram", "schema unifilaire", "IEC 60617", "IEC 60364", "NF C 15-100", "CAD", "diagram as code", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.urls]
Homepage = "https://uniwire.sh"
Documentation = "https://uniwire.sh/docs/"
Repository = "https://github.com/uniwire-dev/uniwire"
Issues = "https://github.com/uniwire-dev/uniwire/issues"
Changelog = "https://github.com/uniwire-dev/uniwire/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = ["reportlab>=4"]
iec81346 = ["uniwire-data-iec81346"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "jsonschema>=4.20", "reportlab>=4", "mcp>=2.0", "ruff>=0.6"]

[project.scripts]
uniwire = "uniwire.cli:main"
uniwire-mcp = "uniwire.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/uniwire/__init__.py"

# The source distribution holds what is needed to build, test and check the package, nothing else.
[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "examples",
  "schema",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "pyproject.toml",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel]
only-include = ["src/uniwire", "examples"]
# The example documents ship in the wheel as uniwire/_examples (read by the MCP tools list_examples / get_example);
# the Python scripts of examples/code/ stay in the repository and the sdist.
exclude = ["examples/code", "__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel.sources]
"src/uniwire" = "uniwire"
"examples" = "uniwire/_examples"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["viewer/dist", "viewer/examples"]

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "UP"]
# Optional[...] is kept in the pydantic models and signatures (readable in the generated schema docs);
# zip() truncation is relied upon where it is used.
ignore = ["UP007", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
# Code-first examples use the documented star import of uniwire.build.
"examples/code/*.py" = ["F403", "F405"]
